<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas desafio 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }
        
        th, td{
            border: 1px solid black;
            padding: 10px;
            width: 100px;
        }

        .cor{
            background-color: gray;
            color: white;
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>Tabela de notas</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="row" class="cor">Área</th>
                <th rowspan="2" scope="row" class="cor">Disciplinas</th>
                <th colspan="2" scope="rowgroup" class="cor">Notas</th>
                <th rowspan="2" scope="row" class="cor">Média</th>
            </tr>
            <tr>
                <th scope="row" class="cor">Nota 1</th>
                <th scope="row" class="cor">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="colgroup">Exatas</th>
                <td>Matematica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" class="cor">Media de Exatas</th>
                <td class="cor">0.00</td>
            </tr>
            <tr>
                <th rowspan="2" scope="colgroup">Humanas</th>
                <td>Historia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" class="cor">Média de Humanas</th>
                <td class="cor">0.00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
