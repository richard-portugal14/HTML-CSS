<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Flexiveis</title>
</head>
<body>
    <h1>Imagens Flexivel</h1>
    <p>Voce esta vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitrar a melhor experiencia.</p>

    <picture>
        <source media="(max-width:800px )" srcset="imagens/paisagem-p.png">
        <source media="(max-width:1196px )" srcset="imagens/paisagem-m.png">
        <img src="imagens/paisagem-g.png" alt="Imagem Grande">
    </picture>
</body>
</html>
