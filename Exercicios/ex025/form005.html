<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Sexo</legend>

        <input type="radio" name="sx" id="isxfem" value="F"> <label for="isxfem">Feminino</label>

    <fieldset>

        <label for="iesvol"><input type="checkbox" name="esvol" id="iesvol">Volei</label> <br>

        <input type="reset" value="Limpar">
    </p>
    </form>
