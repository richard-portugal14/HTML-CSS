<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebra de linhas</h1>
    <hr>
    <p>Voce pode escrever um paragrafo de qualquer jeito basta colocar tudo no meio das tags P</p>
    <p>Se precisar
        quebrar
        o texto voce pode <br> usar a tag &lt;BR&gt; <!--LEES THAN / GREATER THAN-->
    </p>
    <p>Vamos adicionar alguns simbolos/emoji
        &reg;
        &copy;
        &trade;
        &pound;
        &euro;
        &yen;
        &cent;
        &Delta;
        &UpArrow;
    </p>
    <p>Vamos adicionar emojis
        &#x1F596;
        &#x1F913;
    
    </p>
</body>
</html>
