<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }


        table{
            width: 500px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }

        .cnome{
            background-color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Ex. de tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissao</th>
        </tr>
        <tr>
            <td>Yasmin</td>
            <td>F</td>
            <td>19</td>
            <td>Perita digital</td>
        </tr>
        <tr>
            <td>Rick</td>
            <td>M</td>
            <td>20</td>
            <td>Desenvolvedor</td>
        </tr>
        <tr>
            <td>Maike</td>
            <td>M</td>
            <td>20</td>
            <td>Contador</td>
        </tr>
        <tr>
            <td>Carol</td>
            <td>F</td>
            <td>20</td>
            <td>Lider de Logistica</td>
        </tr>
        <tr>
            <td>Messi</td>
            <td>M</td>
            <td>38</td>
            <td>Jogador de Futebol</td>
        </tr>
        <tr>
            <td>Neymar</td>
            <td>M</td>
            <td>34</td>
            <td>Jogador de Futebol</td>
        </tr>
    </table>
</body>
</html>
