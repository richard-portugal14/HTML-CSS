<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        iframe{
            width: 500px;
            height: 500px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando Iframe</h1>
    <p>
        Acessando o site do

        <iframe src="https://www.cursoemvideo.com" frameborder="0"
        height="500" scrolling="no">
            <a href="https://www.cursoemvideo.com"
            target="_blank">Curso em Video</a>
            
        </iframe>
         para aprender a programar.
    </p>
    <p>
        O repositorio do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500px" width="500px">
            <a href="https://gustavoguanabara.github.io" target="_blank">Repositorio Gustavo Guanabara</a>
        </iframe>

        tambem e legal!
    </p>
</body>
</html>
