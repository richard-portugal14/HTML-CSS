<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner{
            background-color: lightblue;
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: lightgray;
            border: 1px solid black;
            
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Outro Conteudo</div>
        <div class="item">Conteudo maior um cadin</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">Conteudo Grande do Caralho Puta que o pariu Que porra e essa</div>
        <div class="item">G</div>
    </div>
</body>
</html>
